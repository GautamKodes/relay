services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app1: &app
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/relay
      DB_USER: relay
      DB_PASSWORD: relay
      REDIS_HOST: redis
      JWT_SECRET: replace-me-with-a-long-random-secret-before-deploying
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  app2: *app

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2

volumes:
  pgdata:
